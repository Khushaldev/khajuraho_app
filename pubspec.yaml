name: khajuraho
description: "Khajuraho, a travel companion app"

publish_to: 'none' 

version: 1.0.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  hive: ^2.2.3
  bloc: ^9.0.0
  flutter_bloc: ^9.1.0
  firebase_core: ^3.13.0
  auto_route: ^10.0.1
  permission_handler: ^11.4.0
  easy_localization: ^3.0.7+1
  svg_flutter: ^0.0.1
  flutter_localizations:
    sdk: flutter
  injectable: ^2.5.0
  json_annotation: ^4.9.0
  google_fonts: ^6.2.1
  intl: ^0.19.0
  uuid: ^4.5.1
  cloud_firestore: ^5.6.6
  firebase_storage: ^12.4.5
  path_provider: ^2.1.5
  freezed_annotation: ^3.0.0
  hydrated_bloc: ^10.0.0
  equatable: ^2.0.7
  hive_flutter: ^1.1.0
  connectivity_plus: ^6.1.4
  firebase_auth: ^5.5.2
  google_sign_in: ^6.3.0
  dio: ^5.8.0+1
  get_it: ^8.0.3
  flutter_dotenv: ^5.2.1
  cached_network_image: ^3.4.1
  flutter_animate: ^4.5.2
  fluttertoast: ^8.2.12


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  auto_route_generator: ^10.0.1
  injectable_generator: ^2.7.0
  build_runner: ^2.4.15
  freezed: ^3.0.6
  json_serializable: ^6.9.5

flutter:
  uses-material-design: true
  assets:
    - lib/resources/
    - lib/resources/icons/
    - lib/resources/images/
    - lib/resources/translations/
    - env/
